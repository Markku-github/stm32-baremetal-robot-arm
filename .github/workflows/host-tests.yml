name: Host Tests

on:
  push:
    branches:
      - main
      - build/github-actions-foundation
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure host-native tests
        run: cmake -S . -B build/host-tests -G Ninja -DROBOT_ARM_BUILD_HOST_TESTS=ON

      - name: Build host-native tests
        run: cmake --build build/host-tests

      - name: Run host-native tests
        run: ctest --test-dir build/host-tests --output-on-failure